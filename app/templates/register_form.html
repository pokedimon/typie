<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Тайпи</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">
    <style>
        body {
            background-image: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)),
            url("{{ url_for('static', filename='img/background.jpg') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center font-montserrat p-4" x-data="authForm()">
    <div
        class="bg-medium-jungle-900/90 w-[35vw] min-w-sm max-w-lg rounded-4xl shadow-lg relative backdrop-blur-xs p-8 border border-white/10">
        <h2 class="text-2xl font-bold text-white mb-6 text-center">Регистрация</h2>
        <form method="POST" class="flex flex-col gap-3 text-white" x-data="{ inSchool: false }"
            @submit.prevent="submitRegister">
            <input type="text" placeholder="Логин" name="login" x-model="login" required
                class="border border-white/20 bg-white/5 text-white p-3 rounded-full focus:outline-none focus:border-bright-lemon-400 transition-colors">
            <input type="password" placeholder="Пароль" name="password" x-model="password" required
                class="border border-white/20 bg-white/5 text-white p-3 rounded-full focus:outline-none focus:border-bright-lemon-400 transition-colors">
            <input type="password" placeholder="Повторите пароль" name="passwordRpt" x-model="passwordRpt"
                required
                class="border border-white/20 bg-white/5 text-white p-3 rounded-full mb-4 focus:outline-none focus:border-bright-lemon-400 transition-colors">
            <input type="text" placeholder="Фамилия" name="lastName" x-model="lastName" required
                class="border border-white/20 bg-white/5 text-white p-3 rounded-full focus:outline-none focus:border-bright-lemon-400 transition-colors">
            <input type="text" placeholder="Имя" name="firstName" x-model="firstName" required
                class="border border-white/20 bg-white/5 text-white p-3 rounded-full focus:outline-none focus:border-bright-lemon-400 transition-colors">
            <div class="flex flex-row justify-between items-center px-3">
                <div class="flex flex-row items-center gap-3 py-3 border border-transparent">
                    Ученик школы
                    <input type="checkbox" id="inSchool" name="inSchool" x-model="inSchool" class="peer" hidden>
                    <label for="inSchool"
                        class="size-6 rounded-full border-white border-2 peer-checked:bg-bright-lemon-400 peer-checked:border-bright-lemon-400 cursor-pointer"></label>
                </div>
                <div class="flex flex-row items-center gap-3" x-show="inSchool">
                    Класс
                    <div class="relative w-full">
                        <input type="number" name="grade" placeholder="1-11" x-model="filterGrade"
                            x-on:keydown="if ($event.key === '-' || $event.key === 'Subtract') $event.preventDefault()"
                            x-on:input="let val = $event.target.value.replace(/[^0-9]/g, ''); if (val !== '') { val = Math.min(Math.max(Number(val), 1), 11); $event.target.value = val; filterGrade = Number(val) } else { filterGrade = '' }"
                            min="1" max="11" step="1" title="Введите класс от 1 до 11"
                            class="w-full px-4 py-3 border border-white/20 bg-white/5 text-white rounded-full focus:outline-none focus:border-bright-lemon-400 transition-colors">
                    </div>
                </div>
            </div>

            <div id="register-messages" class="flex flex-col gap-1"></div>
            {% for m in message %}
            <p class="text-red-500">{{ m }}</p>
            {% endfor %}
            <input type="submit" value="Зарегистрироваться"
                class="bg-bright-lemon-400 hover:bg-bright-lemon-600 text-gray-900 font-bold mt-4 py-2 px-6 rounded-full font-montserrat transition-colors duration-200 cursor-pointer">
        </form>

        <div class="mt-6 pt-4 border-t border-white/10 text-center text-gray-300 text-sm">
            <span>Уже есть аккаунт?</span>
            <a href="{{ url_for('login_form') }}"
                class="text-bright-lemon-400 hover:text-bright-lemon-300 font-bold ml-1 underline transition-colors">
                Войти
            </a>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/modal-route.js') }}"></script>
</body>

</html>
