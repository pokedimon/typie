services:
  web:
    build: .
    container_name: typie_app
    ports:
      - "8081:8081"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app_project
      - FLASK_RUN_HOST=0.0.0.0
      - FLASK_RUN_PORT=8081
    volumes:
      - ./app/db:/app_project/app/db
    restart: unless-stopped